name: test
# One crate, no features, no integration tier yet: one job answers each
# gate. Every job carries `timeout-minutes`, a ceiling against a hang
# rather than a performance budget. GitHub's default when absent is 360.
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: scripts/no-tmp-tempdir.sh
      - run: scripts/ticket-port.sh

  private-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: scripts/check-private.sh
        env:
          PRIVATE_NAMES: ${{ secrets.PRIVATE_NAMES }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: scripts/design-size.sh
      - run: scripts/readme-size.sh
      - run: scripts/docs-links.py
      - run: scripts/parity-gaps.sh
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
      - run: cargo doc --no-deps --locked
    env:
      RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked

  # The tests `#[ignore]`d for needing a real shepherd. One of them is the
  # only test that sees shep answer `NotFound`, which the fake shepherd
  # cannot send.
  real-shepherd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The version in `SHEP_VERSION` (crates/core/src/shepherd.rs) and Cargo.toml.
      SHEP_VERSION: 0.15.0
      KELPIE_TEST_SHEP: ${{ github.workspace }}/.shep/shep
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Install the pinned shep
        run: |
          asset=shep-x86_64-unknown-linux-gnu
          base=https://github.com/shep-pm/shep/releases/download/shep-v${SHEP_VERSION}
          mkdir -p .shep
          curl -fsSL --retry 3 -o ".shep/$asset.tar.gz" "$base/$asset.tar.gz"
          curl -fsSL --retry 3 -o ".shep/$asset.sha256" "$base/$asset.sha256"
          (cd .shep && sha256sum --check "$asset.sha256" && tar -xzf "$asset.tar.gz")
          test "$("$KELPIE_TEST_SHEP" --version | head -n 1)" = "shep ${SHEP_VERSION}"
      # A test binary that matches nothing passes, so the run must show
      # tests that passed; a failing test fails the step on its own.
      - name: Run the real-shepherd tests
        run: |
          set -o pipefail
          cargo test --locked --test dog_smoke -- --ignored | tee dog_smoke.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed' dog_smoke.log

  # The tests `#[ignore]`d for needing kelpie's tools, run under the real
  # sandbox runtime on Linux, where bubblewrap fences the worker. They skip
  # the two that need a login or pi.
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KELPIE_TOOLS: ${{ github.workspace }}/.kelpie-tools
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Install what srt needs on Linux
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep
      # Ubuntu 24.04 runners block unprivileged user namespaces, which
      # bubblewrap needs to build the sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # What `Tools::install` (crates/process/src/tools.rs) does: the pinned
      # package.json, then `npm install` beside it.
      - name: Install the pinned srt
        run: |
          mkdir -p "$KELPIE_TOOLS"
          cp crates/process/src/tools/package.json "$KELPIE_TOOLS/package.json"
          (cd "$KELPIE_TOOLS" && npm install --no-audit --no-fund)
      - run: cargo test --locked --no-run
      # A filter that matches nothing passes, and so does one that matches
      # only some tests, so the run must show each test below as passed. A
      # failing test fails the step on its own. A test given a Linux-only
      # `ignore` for a gap in the fence (see #214) comes off this list.
      # The socket test runs on Linux alone, so it is listed here and nowhere
      # a macOS run reads.
      - name: Run the sandbox tests
        run: |
          set -o pipefail
          cargo test --locked -- --ignored \
            adapters::claude::escapes \
            a_worker_reaches_the_model_only_through_a_forwarder_that_passes_chat \
            --skip a_live_worker_turn_runs_inside_the_sandbox_and_resumes \
            --skip pi_answers_through_the_forwarder_with_no_model_host_in_its_sandbox \
            | tee sandbox.log
          for name in \
            the_worktree_the_build_folder_and_the_transcripts_are_written_and_nothing_outside \
            claude_codes_own_files_are_refused_in_any_case_and_spelling \
            a_nested_claude_folder_that_existed_at_call_start_is_refused \
            codexs_own_files_are_refused_in_any_case \
            a_socket_the_policy_lists_is_still_refused_on_linux \
            a_host_not_allowed_and_a_socket_not_listed_are_refused \
            a_worker_reaches_the_model_only_through_a_forwarder_that_passes_chat; do
            grep -Eq "^test .*::${name} \.\.\. ok$" sandbox.log \
              || { echo "::error::$name did not run and pass"; exit 1; }
          done

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Matches `rust-version` in Cargo.toml, which matches shep's.
      - run: rustup toolchain install 1.88 --profile minimal
      - run: cargo +1.88 check --all-targets --locked

[package]
name = "shep-kelpie-adapters"
description = "The real ports and the forge: gh, curl, the claude, pi and codex command lines, the sandbox programs and the GitHub App. Uses only core and the leaf members"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The stand-ins in `test` that name an adapter, for the tests of the crates above this one
test-support = ["shep-kelpie-core/test-support"]

[dependencies]
shep-kelpie-core.workspace = true
shep-kelpie-facts.workspace = true
shep-kelpie-process.workspace = true
shep-kelpie-tree.workspace = true
shep-kelpie-trim.workspace = true
jiff.workspace = true
rustix.workspace = true
# crabpot is in kelpie's own binary on every platform: `SandboxRuntime` reads
# its Windows status, and the tests check the settings against its parser
# (`default-features = false` in the workspace pin keeps out its CLI)
crabpot.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
shep-channel.workspace = true
shep-handover.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml.workspace = true

[dev-dependencies]
shep-kelpie-core = { workspace = true, features = ["test-support"] }
shep-kelpie-test-support.workspace = true
shep-kelpie-trim = { workspace = true, features = ["test-support"] }
# Only for throwaway homes and repos in tests
tempfile.workspace = true

name: macos nightly
# The whole suite on macOS, where the APFS case folding in `crates/core/src/fence/mod.rs`
# and the Seatbelt policy `crates/adapters/src/adapters/srt/mod.rs` writes run for real. Apart
# from the runner, the trigger and the timeout it is test.yml's `test` job.
#
# Nightly, and on demand, rather than after every merge. The hosted macOS
# runner takes 18 to 27 minutes for the suite, and at that speed a
# timing-sensitive test loses its race now and then: three runs on main
# on 2026-10-17 each failed a different test while the Linux `test` job
# passed beside them. A red main holds kelpie's workers up, and the code
# this job exists for does not change with most merges.
#
# The 30 minutes comes from a local macOS run (about 5 minutes of tests
# after the build) and a hosted run where every test passed but the lib
# suite alone took 17 minutes, so 20 cancelled the job before the rest ran.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      # The runner's own `TMPDIR` under /var/folders is too deep for a rig's
      # pi forwarder socket, three folders below its home, to stay under
      # macOS's 104 bytes. `runner.temp` is short, as a real `SHEP_HOME` is.
      - run: cargo test --locked
        env:
          TMPDIR: ${{ runner.temp }}

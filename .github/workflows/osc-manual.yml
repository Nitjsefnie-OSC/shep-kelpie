# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - lint
#   - docs
#   - test
#   - real-shepherd
#   - sandbox
#   - msrv
#   - conventional
#   - doc-length
# DELIBERATELY EXCLUDED (loud):
#   - private-names: not in the keep list
#   - windows: not in the keep list

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
    - run: cargo fmt --all --check
    - run: cargo clippy --all-targets --locked -- -D warnings
    - run: scripts/no-tmp-tempdir.sh
    - run: scripts/ticket-port.sh
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - run: rustup toolchain install stable --profile minimal
    - run: scripts/design-size.sh
    - run: scripts/readme-size.sh
    - run: scripts/docs-links.py
    - run: scripts/parity-gaps.sh
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
    - run: cargo doc --no-deps --locked
    env:
      RUSTDOCFLAGS: -D warnings
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - run: rustup toolchain install stable --profile minimal
    - run: cargo test --locked
  real-shepherd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHEP_VERSION: 0.16.1
      KELPIE_TEST_SHEP: ${{ github.workspace }}/.shep/shep
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - run: rustup toolchain install stable --profile minimal
    - name: Install the pinned shep
      run: |
        asset=shep-x86_64-unknown-linux-gnu
        base=https://github.com/shep-pm/shep/releases/download/shep-v${SHEP_VERSION}
        mkdir -p .shep
        curl -fsSL --retry 3 -o ".shep/$asset.tar.gz" "$base/$asset.tar.gz"
        curl -fsSL --retry 3 -o ".shep/$asset.sha256" "$base/$asset.sha256"
        (cd .shep && sha256sum --check "$asset.sha256" && tar -xzf "$asset.tar.gz")
        test "$("$KELPIE_TEST_SHEP" --version | head -n 1)" = "shep ${SHEP_VERSION}"
    - name: Run the real-shepherd tests
      run: |
        set -o pipefail
        cargo test --locked -p shep-kelpie --test dog_smoke -- --ignored | tee dog_smoke.log
        grep -Eq 'test result: ok\. [1-9][0-9]* passed' dog_smoke.log
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - run: rustup toolchain install stable --profile minimal
    - name: Install what the sandbox needs on Linux
      run: sudo apt-get update && sudo apt-get install -y bubblewrap ripgrep
    - name: Allow unprivileged user namespaces
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - run: cargo test --locked --no-run
    - name: Run the sandbox tests
      run: |
        set -o pipefail
        cargo test --locked -- --ignored \
          adapters::claude::escapes \
          a_worker_reaches_the_model_only_through_a_forwarder_that_passes_chat \
          --skip a_live_worker_turn_runs_inside_the_sandbox_and_resumes \
          --skip pi_answers_through_the_forwarder_with_no_model_host_in_its_sandbox \
          | tee sandbox.log
        for name in \
          the_worktree_the_build_folder_and_the_transcripts_are_written_and_nothing_outside \
          claude_codes_own_files_are_refused_in_any_case_and_spelling \
          a_nested_claude_folder_that_existed_at_call_start_is_refused \
          codexs_own_files_are_refused_in_any_case \
          a_socket_the_policy_lists_is_still_refused_on_linux \
          a_host_not_allowed_and_a_socket_not_listed_are_refused \
          a_worker_reaches_the_model_only_through_a_forwarder_that_passes_chat; do
          grep -Eq "^test .*::${name} \.\.\. ok$" sandbox.log \
            || { echo "::error::$name did not run and pass"; exit 1; }
        done
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - run: rustup toolchain install 1.88 --profile minimal
    - run: cargo +1.88 check --all-targets --locked
  conventional:
    name: conventional subjects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
        fetch-depth: 0
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - name: Check every commit subject on this branch
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
      run: |
        set -eu
        # --no-merges: this checks the subjects an author wrote. A merge
        # commit's subject is the pull request title (merge_commit_title is
        # PR_TITLE), which this job does not see. Unlike the local hook,
        # fixup!/squash!/amend! markers are refused here: unsquashed, they
        # parse as nothing.
        bad=0
        while IFS= read -r subject; do
          [ -z "$subject" ] && continue
          if printf '%s' "$subject" | grep -qE '^(feat|fix|perf|refactor|docs|test|ci|chore|style)(\([^()]+\))?!?: .+'; then
            printf '  ok       %s\n' "$subject"
          else
            printf '  REFUSED  %s\n' "$subject"
            bad=$((bad + 1))
          fi
        done <<EOF
        $(git log --no-merges --format='%s' "$BASE..$HEAD")
        EOF
        if [ "$bad" -gt 0 ]; then
          echo "::error::$bad commit subject(s) above are not conventional. Rewrite them as: type(optional-scope): lowercase summary"
          exit 1
        fi
        echo "All $(git log --no-merges --oneline "$BASE..$HEAD" | wc -l | tr -d ' ') commit subject(s) are conventional."
  doc-length:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - run: python3 -I scripts/test_doc_length.py
    - run: python3 -I scripts/doc-length.py

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="kelpie">
  <defs><style>
      .ink { stroke: #3B2620; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
      .coat { fill: #D9733A; }
      .coat-dark { fill: #B85A28; }
      .cream { fill: #FBE7CC; }
      .pink { fill: #F6A9A3; }
    </style>
  <clipPath id="tile"><rect width="128" height="128" rx="24"/></clipPath></defs>
  <rect width="128" height="128" rx="24" fill="#2FA597"/>
  <g transform="translate(64 66) scale(0.27) translate(-256 -227)"><g id="head" transform="translate(256 412) scale(0.9) translate(-256 -412)">
  <!-- ears -->
  <path class="coat ink" d="M140 250 Q 124 130 158 58 Q 172 36 192 56 Q 232 112 250 186 Z"/>
  <path class="pink" d="M164 218 Q 156 140 174 92 Q 180 80 188 92 Q 214 136 228 192 Z"/>
  <path class="coat ink" d="M372 250 Q 388 130 354 58 Q 340 36 320 56 Q 280 112 262 186 Z"/>
  <path class="pink" d="M348 218 Q 356 140 338 92 Q 332 80 324 92 Q 298 136 284 192 Z"/>

  <!-- head, with cheek fluff -->
  <path class="coat ink" d="M256 160
    C 340 160, 398 214, 404 284
    L 420 300 L 398 312 L 412 332 L 386 338
    C 364 392, 314 418, 256 418
    C 198 418, 148 392, 126 338
    L 100 332 L 114 312 L 92 300 L 108 284
    C 114 214, 172 160, 256 160 Z"/>

  <!-- cream muzzle and eyebrow spots -->
  <path class="cream" d="M256 252 C 228 252, 208 296, 200 330 C 192 378, 226 404, 256 404 C 286 404, 320 378, 312 330 C 304 296, 284 252, 256 252 Z"/>
  <ellipse class="cream" cx="200" cy="244" rx="14" ry="9" transform="rotate(-12 200 244)"/>
  <ellipse class="cream" cx="312" cy="244" rx="14" ry="9" transform="rotate(12 312 244)"/>
  <path class="coat-dark" d="M256 168 C 246 190, 246 220, 256 248 C 266 220, 266 190, 256 168 Z" opacity="0.55"/>

  <!-- eyes -->
  <ellipse cx="196" cy="290" rx="22" ry="27" fill="#2A1A16"/>
  <ellipse cx="316" cy="290" rx="22" ry="27" fill="#2A1A16"/>
  <circle cx="204" cy="279" r="8.5" fill="#FFFFFF"/>
  <circle cx="324" cy="279" r="8.5" fill="#FFFFFF"/>
  <circle cx="189" cy="300" r="4" fill="#FFFFFF"/>
  <circle cx="309" cy="300" r="4" fill="#FFFFFF"/>

  <!-- cheeks -->
  <ellipse cx="162" cy="338" rx="22" ry="12" fill="#F2777A" opacity="0.45"/>
  <ellipse cx="350" cy="338" rx="22" ry="12" fill="#F2777A" opacity="0.45"/>

  <!-- tongue, mouth, nose -->
  <path class="ink" fill="#EF7586" d="M244 366 C 242 392, 270 392, 268 366 Z"/>
  <path class="ink" fill="none" d="M256 346 L 256 362 M 232 358 Q 244 374 256 362 Q 268 374 280 358"/>
  <path fill="#2A1A16" d="M234 326 Q 256 314 278 326 Q 276 344 256 350 Q 236 344 234 326 Z"/>
  <ellipse cx="248" cy="326" rx="7" ry="3.5" fill="#FFFFFF" opacity="0.7"/>
</g></g>
</svg>
